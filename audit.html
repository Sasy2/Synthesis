<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Ashesi Degree Audit | Degree Audit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="site-name">Ashesi Degree Audit</p>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="audit.html" class="active">Degree Audit</a></li>
        <li><a href="grading-scale.html">Grading Scale</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Computer Science degree audit</h1>
    <noscript>
      <p style="color: #8a1c2b; font-weight: bold;">This application requires JavaScript to function. Please enable JavaScript in your browser.</p>
    </noscript>

    <section>
      <h2>1. Your courses</h2>
      <div id="checklist"></div>
      
      <div class="form-group">
        <label for="semestersCompleted">Semesters completed</label>
        <input type="number" id="semestersCompleted" min="0" max="8" step="1">
      </div>
      
      <div class="form-actions">
        <button type="button" id="auditBtn">Check my progress</button>
        <button type="button" id="clearBtn">Clear all</button>
      </div>
      
      <div id="auditResults" class="results"></div>
    </section>

    <section>
      <h2>2. Target CGPA</h2>
      <div class="form-group">
        <label for="targetGpa">Target CGPA</label>
        <input type="number" id="targetGpa" min="0" max="4" step="0.01">
      </div>
      
      <div class="form-actions">
        <button type="button" id="gpaBtn">Calculate</button>
      </div>
      
      <div id="gpaResults" class="results"></div>
    </section>
  </main>
  <footer>
    <p>Ashesi Degree Audit, a WebTech mini-project by Agatha Suzie Youyou.</p>
  </footer>
  <script src="audit.js"></script>
</body>
</html>
